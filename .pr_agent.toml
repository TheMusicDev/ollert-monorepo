# PR-Agent repo-level config, per https://docs.pr-agent.ai/installation/github/
# ("reads a .pr_agent.toml file from your repository root"). Also mirrored
# as literal dotted env vars (config.model, github_action_config.*, etc. —
# PR-Agent's own convention, not Dynaconf __-nesting) in
# .github/workflows/pr_agent.yml, kept in sync by hand: env vars
# apply on every branch immediately, this file only applies once it's live
# on the default branch — relevant for a PR (like the one that introduced
# this file) that can't see its own not-yet-merged config. Keep both
# updated together; don't let them drift.
#
# Requires an OPENROUTER_API_KEY secret in repo Settings > Secrets and
# variables > Actions.

[config]
# Dropped openrouter/free (the auto-router): on PR #28 it repeatedly routed
# to a broken "Stealth" backend (litellm.APIError 502 "Invalid URL") on
# both /review and /improve. Pinned directly to a specific free model
# instead — bypasses whatever openrouter/free's router is currently
# picking. See https://openrouter.ai/collections/free-models for the
# current roster if this one degrades too.
#
# GLM-5.2 is the primary: strongest instruction-follower of the three free
# models — least likely to wrap YAML output in markdown code fences (which
# crashed PR #31: nemotron returned fenced+duplicated YAML, PR-Agent's
# load_yaml couldn't parse it → TypeError → propagate_tool_errors crashed
# the action before auto_improve ran). Gemma worked for PR #30's review but
# 429'd on #31 (shared free pool), cascading into nemotron which produced
# the bad output. GLM-5.2 primary avoids both: different free pool (no 429
# cascade), and reliably returns raw YAML (no fence-wrapping).
model = "openrouter/z-ai/glm-5.2:free"
# Gemma and nemotron are API-level fallbacks (429/timeout on GLM-5.2's
# free pool). Nemotron produced fence-wrapped YAML on PR #31, so it's the
# last resort, not the first. Verify at
# https://openrouter.ai/collections/free-models if these degrade.
# Keep in sync with .github/workflows/pr_agent.yml.
fallback_models = [
    "openrouter/google/gemma-4-26b-a4b-it:free",
    "openrouter/nvidia/nemotron-3-super-120b-a12b:free",
]
# None of the models above are in PR-Agent's static MAX_TOKENS table
# (pr_agent/algo/__init__.py), so get_max_tokens() raises for every one of
# them unless this is set — every review/improve call failed with "Failed
# to generate prediction with any model" until this was added. 32000 is a
# conservative floor safe for all of them (actual context windows are
# larger); bump if a fallback model's confirmed context window is larger
# and longer diffs get truncated.
custom_model_max_tokens = 32000
# Default (120s) didn't actually bound a hung call: on PR #28, the
# nemotron fallback hung 6m47s past this default before erroring out,
# eating the entire run. Lowered so a hung/overloaded free-tier backend
# fails fast into the next fallback instead of stalling the whole job.
ai_timeout = 45
# Makes /review and /describe raise instead of silently logging and
# returning on failure — see pr_agent.yml's "Fail the check if PR-Agent
# reported a generation failure" step for the fuller picture: this alone
# only reaches the job's exit code on the initial opened/reopened event
# (push-trigger and issue_comment paths swallow it regardless), and
# /improve doesn't respect it in any path. The workflow step is what
# actually makes the check fail for the run that motivated this (PR #28).
propagate_tool_errors = true

[github_action_config]
# auto_review/auto_describe/auto_improve default true already (they run
# once on opened/reopened/ready_for_review) — set explicitly anyway to
# match ci.yml and the official reference workflow's Claude example.
# handle_push_trigger defaults false, so nothing re-ran on later pushes;
# we want /review and /improve to also re-run on every push — not
# /describe, which only needs regenerating if the PR's overall intent
# changes, not on every commit.
auto_review = true
auto_describe = true
auto_improve = true
handle_push_trigger = true
push_commands = ["/review", "/improve"]

[pr_reviewer]
extra_instructions = """\
Focus on:
- Supabase JWT verification, CORS allow-list, and CSRF scope correctness
- Org-membership authorization (owner-or-self) and mass-assignment guards
- Quota check-then-act races (see planning/data-model.md#quotas)
- Error envelope shape adherence (planning/api-contract.md#error-response-shape) — fields is Partial, not Record
- N+1 / query cost implications for CakePHP associations
"""

[pr_code_suggestions]
num_code_suggestions = 5
suggestions_score_threshold = 7

[pr_description]
push_labels = true
publish_labels = true
