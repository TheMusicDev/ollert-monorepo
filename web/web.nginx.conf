# SPA static serving. Real files/dirs as-is, everything else falls back
# to the prerendered shell (index.html) for client-side routing — same
# logic as the .htaccess in scripts/deploy-web.sh, but for nginx.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}