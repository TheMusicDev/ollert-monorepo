# nginx for the CakePHP API. Listens on 80 (kamal-proxy app_port), doc root
# is CakePHP's webroot/, all non-file requests go to index.php via FastCGI
# to php-fpm on :9000.
server {
    listen 80;
    server_name _;
    root /srv/api/webroot;
    index index.php;

    # Serve real files as-is, everything else -> front controller.
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}