name: CI (MCP)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mcp-tests:
    name: MCP tests (tsc / bun test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
        # Full-repo checkout: the drift-guard test reads
        # api/src/Middleware/AuthMiddleware.php from the checkout.

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Matches mcp/package.json's packageManager pin.
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test