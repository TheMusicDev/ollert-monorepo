name: CI (Web)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-tests:
    name: Web tests (Vitest / ESLint / tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Matches web/package.json's packageManager pin.
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
