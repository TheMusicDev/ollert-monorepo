name: CI

# All three jobs below are independent (no `needs:` between them), so
# GitHub Actions runs them in parallel automatically.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  api-tests:
    name: API tests (CakePHP / PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_sqlite
          coverage: none

      - name: Composer install
        uses: ramsey/composer-install@v3
        with:
          working-directory: api

      # No DATABASE_URL needed: PHPUnit only ever touches the 'test'
      # connection (planning/api-contract.md's DB is never queried in CI),
      # which defaults to a throwaway SQLite file per api/.env.example's
      # DATABASE_TEST_URL fallback — see CLAUDE.md's Learnings & Corrections
      # on the MySQL-locking-skips-on-SQLite pattern this relies on.
      - name: Run PHPUnit
        run: composer test
        env:
          SECURITY_SALT: ci-only-placeholder-salt-not-used-in-any-real-environment

      - name: PHP CodeSniffer
        run: composer cs-check

      - name: Composer validate
        run: composer validate --strict

  web-tests:
    name: Web tests (Vitest / ESLint / tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Matches web/package.json's packageManager pin.
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  pr-agent:
    name: PR-Agent review
    runs-on: ubuntu-latest
    # Skip bot-authored PRs (e.g. dependabot) — nothing useful to review.
    if: ${{ github.event.sender.type != 'Bot' }}
    steps:
      - name: PR-Agent
        # the-pr-agent/pr-agent is the community-maintained continuation of
        # the original open-source, bring-your-own-key PR-Agent — NOT
        # qodo-ai/pr-agent, whose GitHub Action now steers toward Qodo's own
        # hosted (rate-limited) free tier instead of a self-hosted BYOK key.
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Add an OPENROUTER_API_KEY secret in repo Settings > Secrets and
          # variables > Actions.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Config passed directly as env vars (Dynaconf's __ nesting
          # convention), NOT via .pr_agent.toml. PR-Agent's repo-settings
          # fetch (GET .pr_agent.toml from the default branch) empirically
          # returned 404 in the actual github_action-tagged Docker image
          # even with the file live on main — confirmed via
          # gh api repos/.../contents/.pr_agent.toml returning it directly,
          # same endpoint PR-Agent's own source claims to use. Whatever the
          # cause (the Docker Hub image tag lagging the GitHub source is the
          # leading theory), env vars sidestep it entirely and also avoid
          # the default-branch dependency altogether — this way config
          # takes effect on every branch immediately, including a PR that's
          # still open. Keep .pr_agent.toml as documentation only; the env
          # vars below are the actual, verified-working source of truth.
          CONFIG__MODEL: 'openrouter/stealth/ox-alpha'
          CONFIG__FALLBACK_MODELS: '@json ["openrouter/free", "openrouter/nvidia/nemotron-3-nano-30b-a3b:free", "openrouter/google/gemma-4-26b-a4b-it:free"]'
          GITHUB_ACTION_CONFIG__HANDLE_PUSH_TRIGGER: '@bool true'
          GITHUB_ACTION_CONFIG__PUSH_COMMANDS: '@json ["/review", "/improve"]'
