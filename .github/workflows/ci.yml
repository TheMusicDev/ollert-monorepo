name: CI

# All three jobs below are independent (no `needs:` between them), so
# GitHub Actions runs them in parallel automatically.
#
# issue_comment (bare — all activity) is here so PR-Agent's manual slash
# commands (e.g. commenting `/improve` on a PR) work, matching the official
# reference workflow: https://docs.pr-agent.ai/installation/github/
# api-tests/web-tests guard themselves to pull_request only (see their
# `if:` below) so an unrelated issue comment doesn't spin up the full test
# suite for no reason.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]
  issue_comment:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write

jobs:
  api-tests:
    name: API tests (CakePHP / PHPUnit)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_sqlite
          coverage: none

      - name: Composer install
        uses: ramsey/composer-install@v3
        with:
          working-directory: api

      # No DATABASE_URL needed: PHPUnit only ever touches the 'test'
      # connection (planning/api-contract.md's DB is never queried in CI),
      # which defaults to a throwaway SQLite file per api/.env.example's
      # DATABASE_TEST_URL fallback — see CLAUDE.md's Learnings & Corrections
      # on the MySQL-locking-skips-on-SQLite pattern this relies on.
      - name: Run PHPUnit
        run: composer test
        env:
          SECURITY_SALT: ci-only-placeholder-salt-not-used-in-any-real-environment

      - name: PHP CodeSniffer
        run: composer cs-check

      - name: Composer validate
        run: composer validate --strict

  web-tests:
    name: Web tests (Vitest / ESLint / tsc)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Matches web/package.json's packageManager pin.
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  pr-agent:
    name: PR-Agent review
    runs-on: ubuntu-latest
    # Skip bot-authored PRs/comments (e.g. dependabot) — nothing to review.
    if: ${{ github.event.sender.type != 'Bot' }}
    steps:
      - name: PR-Agent
        # the-pr-agent/pr-agent is the community-maintained continuation of
        # the original open-source, bring-your-own-key PR-Agent — NOT
        # qodo-ai/pr-agent, whose GitHub Action now steers toward Qodo's own
        # hosted (rate-limited) free tier instead of a self-hosted BYOK key.
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Add an OPENROUTER_API_KEY secret in repo Settings > Secrets and
          # variables > Actions. Set both env var forms for the key: the
          # dotted one is PR-Agent's own per-provider convention (see
          # https://docs.pr-agent.ai/installation/github/'s Claude example,
          # which uses ANTHROPIC.KEY not ANTHROPIC_API_KEY); the plain one
          # is LiteLLM's own standard name, in case PR-Agent's provider
          # plumbing reads that directly for some providers. Costs nothing
          # to set both.
          OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Config as literal dotted env var names — PR-Agent's own
          # convention (confirmed against docs.pr-agent.ai's Claude
          # example), NOT a Dynaconf __-nesting guess. Also set in
          # .pr_agent.toml at the repo root as the documented, more
          # readable mechanism; both are kept in sync so config takes
          # effect even on a branch/PR where .pr_agent.toml hasn't reached
          # the default branch yet (chicken-and-egg for a PR that modifies
          # this very file).
          config.model: 'openrouter/stealth/ox-alpha'
          config.fallback_models: '["openrouter/free", "openrouter/nvidia/nemotron-3-nano-30b-a3b:free", "openrouter/google/gemma-4-26b-a4b-it:free"]'
          github_action_config.auto_review: 'true'
          github_action_config.auto_describe: 'true'
          github_action_config.auto_improve: 'true'
          github_action_config.handle_push_trigger: 'true'
          github_action_config.push_commands: '["/review", "/improve"]'
