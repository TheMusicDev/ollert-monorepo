name: CI (API)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    name: API tests (CakePHP / PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_sqlite
          coverage: none

      - name: Composer install
        uses: ramsey/composer-install@v3
        with:
          working-directory: api

      # No DATABASE_URL needed: PHPUnit only ever touches the 'test'
      # connection (planning/api-contract.md's DB is never queried in CI),
      # which defaults to a throwaway SQLite file per api/.env.example's
      # DATABASE_TEST_URL fallback — see CLAUDE.md's Learnings & Corrections
      # on the MySQL-locking-skips-on-SQLite pattern this relies on.
      - name: Run PHPUnit
        run: composer test
        env:
          SECURITY_SALT: ci-only-placeholder-salt-not-used-in-any-real-environment

      - name: PHP CodeSniffer
        run: composer cs-check

      - name: Composer validate
        run: composer validate --strict
