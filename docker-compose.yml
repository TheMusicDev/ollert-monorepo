# Docker Compose stack for dokploy — replaces kamal + kamal-proxy + negrita
# as the deploy target (interim step before the eventual Cloudflare Workers
# migration in issue #45; kamal configs under config/deploy.*.yml stay in
# place as rollback until this is verified).
#
# api + mcp only for now (see the `web` note below) — each built from its
# existing Dockerfile, unchanged from the kamal setup. Supabase stays
# external (Postgres + Auth); nothing here runs a database container.
#
# dokploy handles domains/TLS itself (built-in Traefik) once this compose
# app is imported — no proxy service here, and no host `ports:` mappings.
# A domain gets attached to a service's internal port from dokploy's own
# UI/API after import, not via compose-file port publishing.
#
# Env vars are NOT baked in here — set them in dokploy's per-app Environment
# tab (mirrors kamal's env.clear/env.secret split across config/deploy.*.yml).
# See .env.dokploy.example for the full list and where each value comes from.
#
# `web` IS NOT IN THIS FILE YET. Its Dockerfile expects a pre-built
# `.output/public` already present in its build context — see that file's
# own comment for why (TanStack Start's SPA prerender fails to bind under
# Bun's Nitro preset inside Docker, so kamal builds it locally first).
# dokploy runs `docker compose build` on its own server with no such
# pre-built output, so `web` failed outright on its first real deploy
# attempt (2026-09-08) — and because compose builds all services in one
# buildx batch, that single failure canceled api/mcp's builds too, even
# though those two have no such issue. Dropped `web` here so api/mcp can
# deploy and get verified independently; add it back once the in-docker
# prerender is fixed (or dokploy is switched to deploy a prebuilt image
# instead of building from source).

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    environment:
      APP_NAME: Ollert
      DEBUG: "false"
      APP_ENCODING: UTF-8
      APP_DEFAULT_LOCALE: en_US
      APP_DEFAULT_TIMEZONE: UTC
      # Prevents Host Header Injection — must match this service's actual
      # public domain once dokploy assigns/routes one.
      APP_FULL_BASE_URL: ${API_FULL_BASE_URL:?set in dokploy Environment}
      SUPABASE_JWT_AUD: authenticated
      JWKS_CACHE_TTL: "900"
      # The web origin allowed to call the API (CORS allow-list).
      CORS_ALLOWED_ORIGINS: ${WEB_ORIGIN:?set in dokploy Environment}
      DATABASE_URL: ${DATABASE_URL:?set in dokploy Environment}
      SECURITY_SALT: ${SECURITY_SALT:?set in dokploy Environment}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:?set in dokploy Environment}
      SUPABASE_JWT_ISS: ${SUPABASE_JWT_ISS:?set in dokploy Environment}

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8766"
    environment:
      SUPABASE_JWT_AUD: authenticated
      JWKS_CACHE_TTL: "900"
      PORT: "8766"
      API_BASE_URL: ${API_PUBLIC_URL:?set in dokploy Environment}
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_URL:?set in dokploy Environment}
      SUPABASE_URL: ${SUPABASE_URL:?set in dokploy Environment}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:?set in dokploy Environment}
      SUPABASE_JWT_ISS: ${SUPABASE_JWT_ISS:?set in dokploy Environment}
      SUPABASE_AS_METADATA_URL: ${SUPABASE_AS_METADATA_URL:?set in dokploy Environment}
